name: Python CI

on:
  push:
    branches:
      - main
      - Branch_Piush

  pull_request:
    branches:
      - main
      - Branch_Piush

jobs:
  python:
    name: Python Pipeline Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: datasets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn xgboost openpyxl joblib

      - name: Check Python syntax
        run: |
          python -m py_compile check_data.py
          python -m py_compile create_future_fire_target.py
          python -m py_compile feature_engineering.py
          python -m py_compile merge_data.py
          python -m py_compile preprocess_data.py
          python -m py_compile train_model.py
          python -m py_compile train_ensemble.py

      - name: Python CI validation complete
        run: |
          echo "======================================"
          echo "THERMAL-X PYTHON CI PASSED"
          echo "======================================"